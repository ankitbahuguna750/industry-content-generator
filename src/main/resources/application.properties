# ==============================
# Server
# ==============================
server.port=8081


# ==============================
# Gemini AI
# ==============================
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash


# ==============================
# Gmail SMTP
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ==============================
# LinkedIn
# ==============================
linkedin.client.id=${LINKEDIN_CLIENT_ID}
linkedin.client.secret=${LINKEDIN_CLIENT_SECRET}
linkedin.redirect.uri=http://localhost:8081/oauth/linkedin/callback


# ==============================
# MySQL Database
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/linkedin_ai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}


# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true