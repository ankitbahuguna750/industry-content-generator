
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/linkedin_ai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.servlet.session.timeout=30m
linkedin.redirect.uri=http://localhost:8081/login/oauth2/code/linkedin

gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.8-flash

spring.security.oauth2.client.registration.googel.client-id=aslfidlas
spring.security.oauth2.client.registration.googel.client-secret=