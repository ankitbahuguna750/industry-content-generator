
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated LinkedIn Posts</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 15px;
            background: #f3f6f8;
            font-family: Arial, sans-serif;
            color: #191919;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .page-header h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .page-header p {
            color: #666;
            line-height: 1.6;
        }

        .linkedin-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            background: #0a66c2;
            color: white;
            font-size: 22px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        .post-card {
            background: white;
            border: 1px solid #dddddd;
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.05);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 17px 20px;
            border-bottom: 1px solid #eeeeee;
        }

        .profile-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #e8f3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0a66c2;
            font-size: 22px;
            font-weight: bold;
        }

        .profile-info h3 {
            margin: 0 0 5px;
            font-size: 16px;
        }

        .profile-info p {
            margin: 0;
            color: #777;
            font-size: 12px;
        }

        .post-number {
            margin-left: auto;
            padding: 7px 10px;
            background: #e8f3ff;
            color: #0a66c2;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .post-content {
            padding: 20px;
            font-size: 15px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .post-content p {
            margin: 0 0 15px;
            white-space: pre-wrap;
        }

        .post-content ul {
            padding-left: 24px;
            margin: 5px 0 18px;
        }

        .post-content li {
            margin-bottom: 8px;
        }

        .post-content .section-heading {
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        .hashtags {
            color: #0a66c2;
            font-weight: 500;
        }

        .post-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 15px 20px;
            border-top: 1px solid #eeeeee;
        }

        button,
        .publish-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 9px;
            border: none;
            border-radius: 7px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-button {
            background: #eeeeee;
            color: #333333;
        }

        .copy-button:hover {
            background: #dddddd;
        }

        .publish-button {
            background: #0a66c2;
            color: white;
        }

        .publish-button:hover {
            background: #004182;
        }

        .publish-button .linkedin-logo {
            width: 23px;
            height: 23px;
            background: white;
            color: #0a66c2;
            font-size: 18px;
        }

        .message {
            text-align: center;
            background: white;
            padding: 25px;
            border-radius: 10px;
            color: #666;
            line-height: 1.7;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            color: #0a66c2;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .page-header h1 {
                font-size: 23px;
            }

            .post-content {
                padding: 16px;
                font-size: 14px;
            }

            .post-actions {
                padding: 13px;
            }

            button,
            .publish-button {
                flex: 1 1 100%;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <a class="back-button" href="/dashboard.html">
        ← Back to Dashboard
    </a>

    <div class="page-header">
        <div class="linkedin-logo">in</div>
        <h1>Your LinkedIn Posts</h1>
        <p>
            Review your AI-generated posts, copy your favourite,
            and open LinkedIn when you are ready to publish.
        </p>
    </div>

    <div id="postsContainer"></div>

</div>

<script>
    // Get the generated posts saved by the dashboard.
    function getSavedPosts() {
        const savedPosts = sessionStorage.getItem("generatedPosts");

        if (!savedPosts) {
            return [];
        }

        try {
            const parsedPosts = JSON.parse(savedPosts);

            if (Array.isArray(parsedPosts)) {
                return parsedPosts;
            }

            if (typeof parsedPosts === "string") {
                return splitPosts(parsedPosts);
            }
        } catch (error) {
            return splitPosts(savedPosts);
        }

        return [];
    }

    // Split a single response into POST 1, POST 2, and POST 3.
    function splitPosts(text) {
        return text
            .split(/(?=POST\s*[123]\s*[:.-]?)/i)
            .map(post => post.trim())
            .filter(post => post.length > 0);
    }

    // Escape generated text before placing it in HTML.
    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Format paragraphs, bullet points, headings, and hashtags.
    function formatPost(text) {
        const lines = String(text)
            .replace(/\r\n/g, "\n")
            .split("\n");

        let html = "";
        let bulletListOpen = false;

        lines.forEach(line => {
            const trimmed = line.trim();

            if (!trimmed) {
                if (bulletListOpen) {
                    html += "</ul>";
                    bulletListOpen = false;
                }
                return;
            }

            const safeLine = escapeHtml(trimmed);

            // Format bullet points.
            if (/^[-*•]\s+/.test(trimmed)) {
                if (!bulletListOpen) {
                    html += "<ul>";
                    bulletListOpen = true;
                }

                html += "<li>" +
                    escapeHtml(trimmed.replace(/^[-*•]\s+/, "")) +
                    "</li>";

                return;
            }

            if (bulletListOpen) {
                html += "</ul>";
                bulletListOpen = false;
            }

            // Highlight section headings.
            if (/^(💡\s*)?Curiosity to ponder\s*:/i.test(trimmed) ||
                /^(✅\s*)?The Takeaway\s*:/i.test(trimmed) ||
                /^Key developments shaping this shift include\s*:/i.test(trimmed)) {

                html += '<p class="section-heading">' + safeLine + "</p>";
                return;
            }

            // Style hashtags.
            if (trimmed.includes("#")) {
                html += '<p class="hashtags">' + safeLine + "</p>";
                return;
            }

            html += "<p>" + safeLine + "</p>";
        });

        if (bulletListOpen) {
            html += "</ul>";
        }

        return html;
    }

    // Copy one complete post to the clipboard.
    async function copyPost(button, postText) {
        try {
            await navigator.clipboard.writeText(postText);
            button.textContent = "Copied!";
        } catch (error) {
            const textArea = document.createElement("textarea");
            textArea.value = postText;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            textArea.remove();
            button.textContent = "Copied!";
        }

        setTimeout(() => {
            button.textContent = "Copy Post";
        }, 2000);
    }

    // Display every generated post in its own card.
    function displayPosts() {
        const container = document.getElementById("postsContainer");
        const posts = getSavedPosts();

        if (posts.length === 0) {
            container.innerHTML = `
                <div class="message">
                    <h3>No generated posts found.</h3>
                    <p>
                        Return to your dashboard and generate posts first.
                    </p>
                    <a href="/dashboard.html">Go to Dashboard</a>
                </div>
            `;
            return;
        }

        container.innerHTML = "";

        posts.forEach((post, index) => {
            const postText = String(post)
                .replace(/^POST\s*[123]\s*[:.-]?\s*/i, "")
                .trim();

            const card = document.createElement("article");
            card.className = "post-card";

            card.innerHTML = `
                <div class="post-header">
                    <div class="profile-icon">in</div>

                    <div class="profile-info">
                        <h3>AI LinkedIn Content Generator</h3>
                        <p>AI-generated content · Review before publishing</p>
                    </div>

                    <span class="post-number">POST ${index + 1}</span>
                </div>

                <div class="post-content">
                    ${formatPost(postText)}
                </div>

                <div class="post-actions">
                    <button class="copy-button" type="button">
                        Copy Post
                    </button>

                    <a
                        class="publish-button"
                        href="https://www.linkedin.com/feed/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <span class="linkedin-logo">in</span>
                        Publish Post on LinkedIn
                    </a>
                </div>
            `;

            const copyButton = card.querySelector(".copy-button");

            copyButton.addEventListener("click", function () {
                copyPost(copyButton, postText);
            });

            container.appendChild(card);
        });
    }

    // Render posts when the page opens.
    displayPosts();
</script>

</body>
</html>
