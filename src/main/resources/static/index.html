
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI LinkedIn Content Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px #00000015;
        }

        h1 {
            color: #17324d;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #0a66c2;
            border-color: #0a66c2;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #0a66c2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            text-align: center;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
        }

        a {
            color: #0a66c2;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Welcome Back</h1>
    <p class="subtitle">AI LinkedIn Content Generator</p>

    <form id="loginForm">

        <label for="email">Email Address</label>
        <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
        >

        <label for="password">Password</label>
        <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
        >

        <button type="submit" id="loginButton">
            Login
        </button>

    </form>

    <p id="message" class="message" role="status"></p>

    <div class="register-link">
        Don't have an account?
        <a href="/register.html">Create Account</a>
    </div>

</div>

<script>
    // Send login details to the Spring Boot backend.
    document.getElementById("loginForm")
        .addEventListener("submit", async function(event) {

        event.preventDefault();

        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        button.disabled = true;
        message.style.color = "#555";
        message.textContent = "Logging in...";

        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({
                    email: document.getElementById("email").value.trim(),
                    password: document.getElementById("password").value
                })
            });

            const result = await response.text();

            if (!response.ok) {
                throw new Error(result || "Login failed. Please try again.");
            }

            message.style.color = "green";
            message.textContent = "Login successful! Opening dashboard...";

            // Open the existing dashboard after successful login.
            window.location.href = "/dashboard.html";

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;
        } finally {
            button.disabled = false;
        }
    });
</script>

</body>
</html>
