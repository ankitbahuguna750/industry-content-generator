<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI LinkedIn Content Generator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .header {
            background: #0A66C2;
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .header p {
            margin: 0;
            font-size: 16px;
        }

        .card {
            background: white;
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
        }

        .generate-btn {
            width: 100%;
            background: #0A66C2;
            color: white;
            font-weight: bold;
        }

        .generate-btn:hover {
            background: #084f96;
        }

        .linkedin-btn {
            display: inline-block;
            background: #0A66C2;
            color: white;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .linkedin-btn:hover {
            background: #084f96;
        }

        .result {
            margin-top: 25px;
        }

        .post {
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            background: #fafafa;
        }

        .post h3 {
            margin-top: 0;
            color: #0A66C2;
        }

        .post-content {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .copy-btn {
            background: #333;
            color: white;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #111;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-weight: bold;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
        }

        .success {
            background: #e5f7e5;
            color: #176b17;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .top-buttons a {
            text-decoration: none;
            color: white;
            background: #333;
            padding: 10px 16px;
            border-radius: 6px;
        }

        .top-buttons a:hover {
            background: #111;
        }

        @media (max-width: 600px) {

            .container {
                width: 95%;
                margin: 20px auto;
            }

            .header h1 {
                font-size: 24px;
            }

            .card {
                padding: 18px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>🚀 AI LinkedIn Content Generator</h1>

        <p>
            Generate attractive LinkedIn posts using
            latest industry news and AI.
        </p>

    </div>


    <!-- MAIN CARD -->

    <div class="card">

        <!-- TOP BUTTONS -->

        <div class="top-buttons">

            <a href="/login.html">
                Login
            </a>

            <a href="/register.html">
                Register
            </a>

            <a href="/linkedin/login">
                Connect LinkedIn
            </a>

        </div>


        <!-- INDUSTRY -->

        <label for="industry">
            Industry
        </label>

        <input
                type="text"
                id="industry"
                placeholder="Example: Technology"
        >


        <!-- TONE -->

        <label for="tone">
            Tone
        </label>

        <select id="tone">

            <option value="Professional">
                Professional
            </option>

            <option value="Friendly">
                Friendly
            </option>

            <option value="Educational">
                Educational
            </option>

        </select>


        <!-- GENERATE BUTTON -->

        <button
                class="generate-btn"
                onclick="generateContent()">

            🚀 Generate LinkedIn Posts

        </button>


        <!-- STATUS -->

        <div
                id="status"
                class="status">
        </div>


        <!-- RESULT -->

        <div
                id="result"
                class="result">
        </div>

    </div>

</div>


<script>

    async function generateContent() {

        const industry =
            document.getElementById("industry").value.trim();

        const tone =
            document.getElementById("tone").value;

        const status =
            document.getElementById("status");

        const result =
            document.getElementById("result");


        // Check industry

        if (industry === "") {

            showError(
                "Please enter an industry."
            );

            return;
        }


        // Loading

        result.innerHTML = `
            <div class="loading">
                ⏳ Generating LinkedIn posts...
                <br>
                Please wait.
            </div>
        `;

        status.style.display = "none";


        try {

            const response =
                await fetch("/api/content", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        industry: industry,

                        tone: tone

                    })

                });


            const data =
                await response.text();


            if (!response.ok) {

                throw new Error(data);

            }


            displayPosts(data);


        } catch (error) {

            console.error(error);

            showError(
                "Something went wrong while generating content."
            );

            result.innerHTML = "";

        }

    }


    function displayPosts(text) {

        const result =
            document.getElementById("result");

        result.innerHTML = "";


        /*
         * Gemini response:
         *
         * POST 1
         *
         * post content
         *
         * POST 2
         *
         * post content
         *
         * POST 3
         *
         * post content
         */


        const posts =
            text.split(/(?=POST [1-3])/);


        let postNumber = 0;


        posts.forEach(function(post) {

            post = post.trim();


            if (post === "") {

                return;

            }


            postNumber++;


            const content =
                post.replace(
                    /^POST [1-3]\s*/,
                    ""
                );


            const postDiv =
                document.createElement("div");

            postDiv.className = "post";


            postDiv.innerHTML = `

                <h3>
                    🚀 POST ${postNumber}
                </h3>

                <div class="post-content">
                    ${escapeHtml(content)}
                </div>

                <button
                        class="copy-btn"
                        onclick="copyPost(this)">

                    📋 Copy Post

                </button>

                <br>

                <button
                        class="linkedin-btn"
                        onclick="publishPost(this)">

                    🔵 Publish on LinkedIn

                </button>

            `;


            result.appendChild(postDiv);

        });

    }


    async function copyPost(button) {

        const post =
            button
                .parentElement
                .querySelector(".post-content")
                .innerText;


        try {

            await navigator.clipboard.writeText(post);

            button.innerText =
                "✅ Copied!";


            setTimeout(function() {

                button.innerText =
                    "📋 Copy Post";

            }, 2000);


        } catch (error) {

            alert(
                "Unable to copy the post."
            );

        }

    }


    async function publishPost(button) {

        const post =
            button
                .parentElement
                .querySelector(".post-content")
                .innerText;


        button.innerText =
            "⏳ Publishing...";


        button.disabled = true;


        try {

            const response =
                await fetch(
                    "/linkedin/publish",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            postText: post

                        })

                    }
                );


            const data =
                await response.text();


            if (!response.ok) {

                throw new Error(data);

            }


            button.innerText =
                "✅ Published";


            showSuccess(data);


        } catch (error) {

            console.error(error);


            button.innerText =
                "🔵 Publish on LinkedIn";


            button.disabled = false;


            showError(
                "LinkedIn publishing failed. " +
                error.message
            );

        }

    }


    function showError(message) {

        const status =
            document.getElementById("status");

        status.className =
            "status error";

        status.innerText =
            "❌ " + message;

        status.style.display =
            "block";

    }


    function showSuccess(message) {

        const status =
            document.getElementById("status");

        status.className =
            "status success";

        status.innerText =
            "✅ " + message;

        status.style.display =
            "block";

    }


    /*
     * Prevent HTML code from being
     * interpreted inside AI generated text.
     */

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.innerText = text;

        return div.innerHTML;

    }

</script>


</body>

</html>
