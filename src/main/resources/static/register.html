
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AI LinkedIn Content Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px #00000015;
        }

        h1 {
            color: #17324d;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, select {
            display: block;
            width: 100%;
            max-width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            background: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #0a66c2;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            text-align: center;
            overflow-wrap: anywhere;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #0a66c2;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Create Account</h1>
    <p class="subtitle">Start generating LinkedIn content with AI</p>

    <form id="registerForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" required
               placeholder="Enter your full name">

        <label for="email">Email Address</label>
        <input type="email" id="email" required
               placeholder="Enter your email">

        <button type="button" id="sendOtpButton">
            Send OTP
        </button>

        <div id="otpSection" class="hidden">
            <label for="otp">Email OTP</label>
            <input type="text" id="otp"
                   inputmode="numeric"
                   pattern="[0-9]{6}"
                   maxlength="6"
                   placeholder="Enter 6-digit OTP">

            <button type="button" id="verifyOtpButton">
                Verify OTP
            </button>
        </div>

        <label for="password">Password</label>
        <input type="password" id="password"
               minlength="8" required
               placeholder="Create a password">

        <label for="industry">Industry</label>
        <select id="industry" required>
            <option value="">Select your industry</option>
            <option value="Technology">Technology / IT</option>
            <option value="Finance">Finance</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Education">Education</option>
            <option value="Marketing">Marketing</option>
            <option value="Manufacturing">Manufacturing</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit" id="registerButton">
            Create Account
        </button>
    </form>

    <p id="message" class="message" role="status"></p>

    <div class="login-link">
        Already have an account?
        <a href="/login.html">Login</a>
    </div>
</div>

<script>
    // Tracks whether the backend has verified this email's OTP.
    let otpVerified = false;

    const emailInput = document.getElementById("email");
    const otpSection = document.getElementById("otpSection");
    const message = document.getElementById("message");

    // Sends an OTP to the entered email address.
    document.getElementById("sendOtpButton")
        .addEventListener("click", async function() {

        const email = emailInput.value.trim();

        if (!email) {
            message.textContent = "Please enter your email first.";
            return;
        }

        try {
            const response = await fetch("/api/auth/send-otp", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email: email })
            });

            const result = await response.text();

            if (!response.ok) {
                throw new Error(result || "Could not send OTP.");
            }

            otpSection.classList.remove("hidden");
            message.textContent = result || "OTP sent. Check your email.";

        } catch (error) {
            message.textContent = error.message;
        }
    });

    // Verifies the OTP with the backend.
    document.getElementById("verifyOtpButton")
        .addEventListener("click", async function() {

        const otp = document.getElementById("otp").value.trim();

        if (!/^[0-9]{6}$/.test(otp)) {
            message.textContent = "Enter the 6-digit OTP.";
            return;
        }

        try {
            const response = await fetch("/api/auth/verify-otp", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: emailInput.value.trim(),
                    otp: otp
                })
            });

            const result = await response.text();

            if (!response.ok) {
                throw new Error(result || "OTP verification failed.");
            }

            otpVerified = true;
            emailInput.readOnly = true;
            document.getElementById("sendOtpButton").disabled = true;
            message.textContent = "Email verified successfully.";

        } catch (error) {
            message.textContent = error.message;
        }
    });

    // Registers the user only after successful OTP verification.
    document.getElementById("registerForm")
        .addEventListener("submit", async function(event) {

        event.preventDefault();

        if (!otpVerified) {
            message.textContent = "Please verify your email OTP first.";
            return;
        }

        const button = document.getElementById("registerButton");
        button.disabled = true;
        message.textContent = "Creating your account...";

        try {
            const response = await fetch("/api/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: document.getElementById("name").value.trim(),
                    email: emailInput.value.trim(),
                    password: document.getElementById("password").value,
                    industry: document.getElementById("industry").value
                })
            });

            const result = await response.text();

            if (!response.ok) {
                throw new Error(result || "Registration failed.");
            }

            message.textContent = "Account created successfully. Redirecting to login...";

            setTimeout(function() {
                window.location.href = "/login.html";
            }, 1000);

        } catch (error) {
            message.textContent = error.message;
        } finally {
            button.disabled = false;
        }
    });

    // Requires a new OTP if the user changes the email address.
    emailInput.addEventListener("input", function() {
        otpVerified = false;
        emailInput.readOnly = false;
        document.getElementById("sendOtpButton").disabled = false;
    });
</script>
</body>
</html>
